<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1B5E20">
  <title>Dashboard - Presensi Pondok Pesantren</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-top">
      <div>
        <h1>Presensi Pesantren</h1>
        <div class="header-subtitle" id="headerDate"></div>
      </div>
      <button class="btn-logout" onclick="Auth.logout()">Keluar</button>
    </div>
  </div>

  <!-- Content -->
  <div class="container">
    <!-- Statistik Hari Ini -->
    <div class="card">
      <div class="card-title">
        <span class="icon">&#128202;</span> Statistik Hari Ini
      </div>
      <div id="statsLoading" class="loading">
        <div class="spinner"></div>
        <span>Memuat data...</span>
      </div>
      <div id="statsContent" class="hidden">
        <div class="stats-grid">
          <div class="stat-card hadir">
            <div class="stat-number" id="statHadir">0</div>
            <div class="stat-label">Hadir</div>
          </div>
          <div class="stat-card izin">
            <div class="stat-number" id="statIzin">0</div>
            <div class="stat-label">Izin</div>
          </div>
          <div class="stat-card sakit">
            <div class="stat-number" id="statSakit">0</div>
            <div class="stat-label">Sakit</div>
          </div>
          <div class="stat-card alfa">
            <div class="stat-number" id="statAlfa">0</div>
            <div class="stat-label">Alfa</div>
          </div>
        </div>
        <div class="date-info" id="presensiInfo">Belum ada presensi hari ini</div>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="card">
      <div class="card-title">
        <span class="icon">&#9889;</span> Menu Cepat
      </div>
      <div class="quick-actions">
        <a href="presensi.html" class="action-btn">
          <div class="action-icon">&#9997;</div>
          <span class="action-label">Presensi</span>
        </a>
        <a href="santri.html" class="action-btn">
          <div class="action-icon">&#128100;</div>
          <span class="action-label">Data Santri</span>
        </a>
        <a href="rekap.html" class="action-btn">
          <div class="action-icon">&#128203;</div>
          <span class="action-label">Rekap</span>
        </a>
        <a href="libur.html" class="action-btn">
          <div class="action-icon">&#128197;</div>
          <span class="action-label">Hari Libur</span>
        </a>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item active">
      <span class="nav-icon">&#127968;</span>
      <span>Beranda</span>
    </a>
    <a href="presensi.html" class="nav-item">
      <span class="nav-icon">&#9997;</span>
      <span>Presensi</span>
    </a>
    <a href="santri.html" class="nav-item">
      <span class="nav-icon">&#128100;</span>
      <span>Santri</span>
    </a>
    <a href="rekap.html" class="nav-item">
      <span class="nav-icon">&#128203;</span>
      <span>Rekap</span>
    </a>
    <a href="libur.html" class="nav-item">
      <span class="nav-icon">&#128197;</span>
      <span>Libur</span>
    </a>
  </nav>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
