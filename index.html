<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1B5E20">
  <title>Login - Presensi Pondok Pesantren</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-icon">&#127969;</div>
      <h1 class="login-title">Presensi Pondok Pesantren</h1>
      <p class="login-subtitle">Silakan masukkan password untuk melanjutkan</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Masukkan password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" id="btnLogin">
          Masuk
        </button>
        <p id="loginError" class="text-danger mt-1 hidden" style="font-size: 0.85rem;"></p>
      </form>

    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Jika sudah login, langsung ke dashboard
    if (Auth.isLoggedIn()) {
      window.location.href = 'dashboard.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      const errorEl = document.getElementById('loginError');
      const password = document.getElementById('password').value.trim();

      if (!password) return;

      btn.disabled = true;
      btn.textContent = 'Memproses...';
      errorEl.classList.add('hidden');

      const result = await API.login(password);

      if (result.success) {
        Auth.setLoggedIn();
        window.location.href = 'dashboard.html';
      } else {
        errorEl.textContent = result.message || 'Password salah';
        errorEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Masuk';
      }
    });
  </script>
</body>
</html>
