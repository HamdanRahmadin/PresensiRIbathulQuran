<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1B5E20">
  <title>Login - Presensi Ribathul Qur'an</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <img class="login-logo" src="LOGO HUFFADHKRAPYAK 2018.jpg" alt="Logo Pondok Pesantren">
      <h1 class="login-title">Presensi Ribathul Qur'an</h1>
      <p class="login-subtitle">Silakan masukkan password untuk melanjutkan</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="form-control" placeholder="Masukkan username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Masukkan password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" id="btnLogin">
          Masuk
        </button>
        <p id="loginError" class="text-danger mt-1 hidden" style="font-size: 0.85rem;"></p>
      </form>

    </div>
  </div>

  <div class="footer-copyright">© 2026 Ribathul Qur'an</div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Jika sudah login, langsung ke dashboard
    if (Auth.isLoggedIn()) {
      window.location.href = 'dashboard.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      const errorEl = document.getElementById('loginError');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!username || !password) return;

      btn.disabled = true;
      btn.textContent = 'Memproses...';
      errorEl.classList.add('hidden');

      const result = await API.login(username, password);

      if (result.success && result.user) {
        Auth.setLoggedIn(result.user);
        window.location.href = 'dashboard.html';
      } else {
        errorEl.textContent = result.message || 'Username atau Password salah';
        errorEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Masuk';
      }
    });
  </script>
</body>
</html>
